<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0a0509;
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        background:
          radial-gradient(circle at 30% 38%, rgba(255, 45, 143, 0.22), transparent 42%),
          radial-gradient(circle at 62% 62%, rgba(155, 92, 246, 0.18), transparent 46%),
          radial-gradient(circle at 85% 20%, rgba(255, 77, 79, 0.14), transparent 40%),
          #0a0509;
        overflow: hidden;
      }

      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      .portrait {
        position: absolute;
        right: 26px;
        bottom: 0;
        height: 630px;
        width: auto;
        object-fit: contain;
        object-position: bottom;
        -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 78%, rgba(0, 0, 0, 0.35) 92%, transparent 100%);
        mask-image: linear-gradient(180deg, #000 0%, #000 78%, rgba(0, 0, 0, 0.35) 92%, transparent 100%);
      }

      .copy {
        position: absolute;
        top: 50%;
        left: 88px;
        transform: translateY(-50%);
        width: 640px;
      }

      .badge {
        display: inline-flex;
        margin-bottom: 28px;
        padding: 10px 20px;
        border: 1px solid rgba(255, 45, 143, 0.35);
        border-radius: 999px;
        background: rgba(255, 45, 143, 0.1);
        color: #ff6fb5;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .name {
        margin: 0 0 18px;
        color: #f5f5f7;
        font-size: 76px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.05;
      }

      .positioning {
        margin: 0;
        background: linear-gradient(135deg, #ff2d8f, #9b5cf6, #ff4d4f);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        color: transparent;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="copy">
        <span class="badge">AI Solution Sales · Transformation · Speaking</span>
        <h1 class="name">Max Kirst</h1>
        <p class="positioning">Enterprise AI, Solution Sales<br />and Speaker</p>
      </div>
      <img class="portrait" src="../portraits/portrait-editorial.png" alt="" />
    </div>
  </body>
</html>
